# api.masterdoc.pro — TLS terminate → api-gateway blue/green
# Active slot port is in /etc/nginx/api-upstream.conf (rewritten by blue-green.sh).
# Do NOT point this site at masterdoc-backend :8081.

upstream api_gateway {
    include /etc/nginx/api-upstream.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.masterdoc.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.masterdoc.pro;

    ssl_certificate     /etc/letsencrypt/live/api.masterdoc.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.masterdoc.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
