openapi: 3.1.0
info:
  title: Masterdoc API Gateway
  version: 0.1.0
  description: |
    Single public API base for clients: `https://api.masterdoc.pro`.
    REST-клиент знает только этот host (см. docs/AUTH.md).

    - `GET /auth/url` — куда открыть браузер для логина (страница Zitadel)
    - `POST /auth/token` — обмен code / refresh на токены (BFF → Zitadel)
    - `GET /me` — userInfo + features (нужен Bearer JWT)
    - `/admin/users*` — invite / list / roles / resend (Bearer + feature `user_invite`)
    - `/v1/*` — proxy в backend

servers:
  - url: https://api.masterdoc.pro
    description: Production (only API URL clients should use)
  - url: http://127.0.0.1:8083
    description: Local gateway

paths:
  /health:
    get:
      operationId: health
      summary: Gateway liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/url:
    get:
      operationId: getAuthUrl
      summary: OIDC authorize URL for client login (public)
      security: []
      responses:
        "200":
          description: Where the client should start Authorization Code + PKCE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUrlResponse"

  /auth/token:
    post:
      operationId: postAuthToken
      summary: Exchange authorization code or refresh_token for tokens (BFF → Zitadel)
      description: |
        Проксирует тело как есть на Zitadel `POST /oauth/v2/token`.
        Клиент **не** ходит на auth.fixaverse.ru за токенами — только сюда.

        `grant_type=authorization_code` — после callback с `code`.
        `grant_type=refresh_token` — обновить access_token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id:
                  type: string
                code:
                  type: string
                  description: Required when grant_type=authorization_code
                redirect_uri:
                  type: string
                  description: Same redirect_uri as in authorize (authorization_code)
                code_verifier:
                  type: string
                  description: PKCE verifier (authorization_code)
                refresh_token:
                  type: string
                  description: Required when grant_type=refresh_token
            examples:
              authorizationCode:
                summary: Exchange code
                value:
                  grant_type: authorization_code
                  code: "...."
                  redirect_uri: masterdoc://auth/callback
                  client_id: native-app-id
                  code_verifier: "...."
              refresh:
                summary: Refresh access token
                value:
                  grant_type: refresh_token
                  refresh_token: "...."
                  client_id: native-app-id
      responses:
        "200":
          description: Token response from Zitadel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Upstream OAuth error (invalid_grant, …) — body as from Zitadel
        "502":
          description: Zitadel unavailable

  /me:
    get:
      operationId: getMe
      summary: Current user + enabled features for client DI
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User and features
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid JWT
        "502":
          description: feature-service unavailable

  /admin/users/invites:
    post:
      operationId: postAdminUserInvite
      summary: Invite a user and assign product roles
      description: |
        Creates a human user in Zitadel (invitation email) and assigns project role grants.
        Caller must have feature `user_invite` (typically via `admin` role in feature-service).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
            example:
              email: ivan@company.ru
              givenName: Ivan
              familyName: Petrov
              roles: [technologist]
      responses:
        "201":
          description: User created and invite sent (when IdP accepts email send)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Validation error or unknown role (plain text)
        "401":
          description: Missing or invalid JWT
        "403":
          description: Authenticated but missing `user_invite` feature
        "409":
          description: Email already registered (plain text)
        "502":
          description: Zitadel Management API unavailable or misconfigured

  /admin/users:
    get:
      operationId: getAdminUsers
      summary: List users in the product org
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing `user_invite` feature
        "502":
          description: Zitadel Management API unavailable

  /admin/users/{id}/roles:
    put:
      operationId: putAdminUserRoles
      summary: Replace a user's project role grants
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Zitadel user id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesRequest"
            example:
              roles: [technologist, reporter]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Empty roles or unknown role (plain text)
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing `user_invite` feature
        "404":
          description: Unknown user id (plain text)
        "502":
          description: Zitadel Management API unavailable

  /admin/users/{id}/resend-invite:
    post:
      operationId: postAdminUserResendInvite
      summary: Resend invitation email for an invited user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Zitadel user id
      responses:
        "204":
          description: Invite resent (no body)
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing `user_invite` feature
        "404":
          description: Unknown user id (plain text)
        "409":
          description: User already active (plain text)
        "502":
          description: Zitadel Management API unavailable

  /v1/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Path under backend (assistants, chat/sessions, report, …)
    get:
      operationId: proxyV1Get
      summary: Proxy GET to backend
      security: []
      responses:
        "200":
          description: Upstream response
        "502":
          description: backend unavailable
    post:
      operationId: proxyV1Post
      summary: Proxy POST to backend (incl. streaming where applicable)
      security: []
      responses:
        "200":
          description: Upstream response
        "502":
          description: backend unavailable
    delete:
      operationId: proxyV1Delete
      summary: Proxy DELETE to backend
      security: []
      responses:
        "200":
          description: Upstream response
        "502":
          description: backend unavailable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Zitadel access_token (Authorization Code + PKCE)

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    AuthUrlResponse:
      type: object
      required: [authUrl]
      properties:
        authUrl:
          type: string
          format: uri
          example: https://auth.fixaverse.ru/oauth/v2/authorize

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        id_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 43200

    UserInfo:
      type: object
      required: [id, roles]
      properties:
        id:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string

    MeResponse:
      type: object
      required: [userInfo, features]
      properties:
        userInfo:
          $ref: "#/components/schemas/UserInfo"
        features:
          type: array
          items:
            type: string
          example: [board]

    InviteUserRequest:
      type: object
      required: [email, givenName, familyName, roles]
      properties:
        email:
          type: string
          format: email
        givenName:
          type: string
        familyName:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [admin, dispatcher, engineer, requester, reporter, technologist]

    SetRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [admin, dispatcher, engineer, requester, reporter, technologist]

    AdminUser:
      type: object
      required: [id, email, givenName, familyName, roles, state]
      properties:
        id:
          type: string
          description: Zitadel user id
        email:
          type: string
          format: email
        givenName:
          type: string
        familyName:
          type: string
        roles:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [invited, active, inactive]
        inviteSent:
          type: boolean
          description: Present on invite/resend responses; may be omitted on list

    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          minimum: 0
